<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lernio – Offline</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f7f8fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a2e;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      padding-top: calc(env(safe-area-inset-top) + 2rem);
      padding-bottom: calc(env(safe-area-inset-bottom) + 2rem);
    }
    .emoji { font-size: 3.5rem; margin-bottom: 0.5rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { color: #6b7280; margin: 0 0 1.5rem; max-width: 26rem; line-height: 1.5; }
    button {
      border: none;
      background: #4f46e5;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="emoji">📡</div>
    <h1>Du bist offline</h1>
    <p>Lernio braucht für diese Seite eine Internetverbindung. Sobald du wieder online bist, kannst du ganz normal weiterlernen.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </div>
</body>
</html>
